name: Weekly Contract Winners Scan

on:
  schedule:
    # Sunday 7am AEST (9pm Saturday UTC)
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run contract winners scan
        run: python contract_winners.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f results.csv
          git diff --cached --quiet || git commit -m "Update contract winners scan results $(date -u +%Y-%m-%d)"
          git push
